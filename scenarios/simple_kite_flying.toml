# NOTE: this kite does not fly, and the reason is a bridle-geometry error in the
# scenario, not an engine problem. Its tow point sits at 14.7% of chord aft of the
# nose, and solving junction equilibrium against the tether direction at the flight
# elevation gives leg tensions of -1.30 T (nose) and +1.33 T (each tip). The nose
# leg's tension is NEGATIVE: it would have to push. A tension-only bridle line
# cannot, so the nose leg is permanently slack and the bridle degenerates to the two
# tip legs, which attach on the span axis and therefore have almost no moment arm
# about it. The kite is left with no pitch restraint at all, feathers to near-zero
# incidence, loses lift and sinks.
#
# Kept as a diagnostic case: it is exactly the failure the frozen-attitude bug used
# to hide, because welded rod frames held the kite's attitude rigid and no bridle
# leg had to carry a pitching moment for it to appear to fly. For a scenario whose
# bridle trim is derived rather than assumed, see diamond_kite_freeflight.toml.

