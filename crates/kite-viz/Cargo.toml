[package]
name = "kite-viz"
version = "0.1.0"
edition = "2021"
description = "Native egui/wgpu debug + CAD viewer for kite-core. Dev tool, not part of the engine milestone plan."

[dependencies]
kite-core = { path = "../kite-core" }
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts"] }
glam = { version = "0.24", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
